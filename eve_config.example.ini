# Copy to eve_config.ini (same folder as main.py) and set the paths of this machine.
# Any key can also be set by an environment variable: EVE_DATA_DIR, EVE_HMM_DIR,
# EVE_DIAMOND_DIR, EVE_RESULTS_DIR, EVE_PFAM_HMM. Check the result with: ./eve-tool config
[paths]
# Root folder; the other paths default to subfolders of it
data_dir = ~/eve_data

# HMM databases, RVDB, CDD and taxdump (default: <data_dir>/Data_base_hmm_eves)
# hmm_dir = ~/eve_data/Data_base_hmm_eves

# DIAMOND databases: mydb.dmnd, geral/uniprot_sprot.dmnd (default: <data_dir>/DIAMOND)
# diamond_dir = ~/eve_data/DIAMOND

# Where the runs are written (default: <data_dir>/Resultados)
# results_dir = ~/eve_data/Resultados

# Pfam-A.hmm pressed with hmmpress (default: <data_dir>/Pfam/Pfam-A.hmm)
# pfam_hmm = ~/eve_data/Pfam/Pfam-A.hmm
